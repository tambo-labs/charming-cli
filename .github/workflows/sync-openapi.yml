name: Sync OpenAPI

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: sync-openapi
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.CLI_SYNC_APP_ID }}
          private-key: ${{ secrets.CLI_SYNC_APP_PRIVATE_KEY }}
          owner: tambo-labs
          repositories: charming-cli
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: git switch -C automation/openapi-sync
      - run: bun scripts/sync-openapi.ts
      - run: bun run openapi:gen
      - id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.changed == 'true'
        run: bun run check
      - if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "charming-cli-sync[bot]"
          git config user.email "charming-cli-sync[bot]@users.noreply.github.com"
          git add openapi.json UPSTREAM.json src/generated/operations.ts
          git commit -m "chore: sync Charming OpenAPI"
          git push --force origin automation/openapi-sync
      - if: steps.changes.outputs.changed == 'true'
        run: |
          count=$(gh pr list --head automation/openapi-sync --state open --json number --jq length)
          if [ "$count" -eq 0 ]; then
            gh pr create \
              --base main \
              --head automation/openapi-sync \
              --title "chore: sync Charming OpenAPI" \
              --body "Updates the OpenAPI snapshot, generated command catalog, source commit, and contract digest from tambo-ai/charming."
          fi
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
